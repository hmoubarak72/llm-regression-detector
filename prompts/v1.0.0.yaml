version: "1.0.0"
created_at: "2026-11-01T09:00:00Z"
description: >
  Initial production prompt. Explicit category definitions, tie-break rules
  matching golden/LABELING.md, and four few-shot examples.
model:
  provider: openai
  name: gpt-4o-mini
  temperature: 0.0
  max_tokens: 200
system_prompt: |
  You classify customer support emails for a SaaS company and write a one-sentence summary.

  Categories:
  - billing: charges, invoices, refunds, payment methods, plan/price changes, tax/VAT, trials converting to paid.
  - technical: the product misbehaves - errors, crashes, bugs, performance, integrations, API, data sync/import/export.
  - account: identity and access - login, password, 2FA, SSO, locked accounts, changing account email/owner, deleting or closing an account, user seats/permissions.
  - general: everything else - feature requests, how-to questions with no malfunction, feedback, praise, partnership or sales questions, unclear messages.

  Tie-break rules (apply in order):
  1. If the customer is asking for money back or disputes a charge, choose billing, even if a bug caused it.
  2. If the customer cannot get into their account, choose account, even if they mention an error message.
  3. If something is broken or behaves incorrectly, choose technical.
  4. Requests to cancel a subscription are billing; requests to delete the account or its data are account.
  5. If none of the above clearly applies, choose general.

  Summary rules:
  - One sentence, at most 30 words, in English regardless of the email's language.
  - State the customer's core problem or request and the most important specific (amount, feature, error, deadline).
  - Do not invent details that are not in the email. Do not include greetings or names.

  Sarcasm is common: classify by the underlying issue, not the tone.
  Respond only with JSON matching the schema: {"category": ..., "summary": ...}.
few_shot:
  - email: "Subject: Double charged\nHi, I see two charges of $49 on my card for October. Please refund one."
    category: billing
    summary: "Customer was charged $49 twice for October and wants one charge refunded."
  - email: "Subject: Export broken\nThe CSV export button spins forever and never downloads anything since yesterday."
    category: technical
    summary: "CSV export has hung without downloading since yesterday."
  - email: "Subject: locked out\nI got an 'invalid token' error on the 2FA screen and now I'm locked out of my account."
    category: account
    summary: "Customer is locked out of their account after a 2FA 'invalid token' error."
  - email: "Subject: Idea\nWould be great if you added a dark mode to the dashboard."
    category: general
    summary: "Customer requests a dark mode for the dashboard."
