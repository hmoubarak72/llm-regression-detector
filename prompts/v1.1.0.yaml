version: "1.1.0"
created_at: "2026-11-05T14:30:00Z"
description: >
  Token-cost reduction experiment: shorter system prompt, tie-break rules and
  few-shot examples removed. Expected to be cheaper; this is the kind of change
  the pipeline exists to check before it ships.
model:
  provider: openai
  name: gpt-4o-mini
  temperature: 0.0
  max_tokens: 120
system_prompt: |
  Classify the customer support email as billing, technical, account or general,
  and summarize it in one sentence. Respond only with JSON: {"category": ..., "summary": ...}.
few_shot: []
